# GitHub Backup Tool Configuration
spring.application.name=gh-backup
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.github.backup=INFO

# Backup directory configuration
# Default uses user home directory for cross-platform compatibility
# Can be overridden with -Dbackup.directory=/custom/path
backup.directory=${user.home}/gh-backups

# Backup mode: 'cli' for command line, 'web' for web server
# Can be overridden with -Dbackup.mode=web
backup.mode=cli

# Web application type - set to 'none' by default for CLI mode
spring.main.web-application-type=none

# Web server configuration (used when backup.mode=web)
server.port=8080
