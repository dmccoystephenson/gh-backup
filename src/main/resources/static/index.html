<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Backup Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🗂️ GitHub Backup Manager</h1>
            <p class="subtitle">Manage your GitHub repository backups</p>
        </header>

        <main>
            <section class="backup-section">
                <h2>Create New Backup</h2>
                <form id="backupForm">
                    <div class="form-group">
                        <label for="userOrOrg">GitHub User or Organization:</label>
                        <input 
                            type="text" 
                            id="userOrOrg" 
                            name="userOrOrg" 
                            placeholder="e.g., octocat" 
                            required
                        >
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <span id="backupButtonText">Start Backup</span>
                        <span id="backupSpinner" class="spinner" style="display: none;"></span>
                    </button>
                </form>
                <div id="backupMessage" class="message"></div>
            </section>

            <section class="status-section">
                <div class="section-header">
                    <h2>Backup Status</h2>
                    <button id="refreshBtn" class="btn btn-secondary">
                        <span id="refreshButtonText">Refresh</span>
                        <span id="refreshSpinner" class="spinner" style="display: none;"></span>
                    </button>
                </div>
                <div id="statusContent">
                    <p class="loading">Loading status...</p>
                </div>
            </section>
        </main>

        <footer>
            <p>GitHub Backup Tool - <a href="https://github.com/dmccoystephenson/gh-backup" target="_blank">View on GitHub</a></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
